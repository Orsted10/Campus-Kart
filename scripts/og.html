<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; background: #F4F0E8; color: #171717;
    font-family: "Geist", "Helvetica Neue", Arial, sans-serif;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px;
  }
  .micro { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: #6F6C66; }
  h1 { font-size: 108px; line-height: .92; letter-spacing: -.045em; font-weight: 600; margin-top: 18px; }
  .serif { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 400; color: #2875D3; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; letter-spacing: -.04em; }
  .brand span { color: #2875D3; }
  .chips { display: flex; gap: 14px; }
  .chip { border: 1px solid #D8D3C8; border-radius: 999px; padding: 10px 22px; font-size: 17px; color: #6F6C66; background: #FAF9F6; }
  .chip b { font-weight: 500; }
  .f { color: #C9653B; } .r { color: #2875D3; } .e { color: #65705A; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(#D8D3C8 1px, transparent 1px), linear-gradient(90deg, #D8D3C8 1px, transparent 1px); background-size: 60px 60px; opacity: .28; }
  .route { position: absolute; right: -40px; top: 150px; width: 640px; height: 340px; }
  .tag { font-size: 21px; color: #6F6C66; letter-spacing: -.01em; margin-top: 26px; }
</style>
</head>
<body>
  <div class="grid"></div>

  <svg class="route" viewBox="0 0 640 340" fill="none">
    <path d="M20,40 C 220,40 260,170 420,170 C 540,170 560,90 620,60" stroke="#C9653B" stroke-width="3" stroke-dasharray="10 12"/>
    <path d="M20,300 C 200,300 280,180 420,170" stroke="#2875D3" stroke-width="3"/>
    <path d="M120,330 C 260,330 320,200 420,170 C 520,140 560,250 620,290" stroke="#65705A" stroke-width="3" stroke-dasharray="2 12"/>
    <circle cx="420" cy="170" r="26" fill="#F4F0E8" stroke="#2875D3" stroke-width="3"/>
    <circle cx="420" cy="170" r="7" fill="#2875D3"/>
    <circle cx="20" cy="40" r="7" fill="#C9653B"/>
    <circle cx="20" cy="300" r="7" fill="#2875D3"/>
    <circle cx="120" cy="330" r="7" fill="#65705A"/>
  </svg>

  <div class="row" style="position:relative">
    <div class="brand">
      <svg width="42" height="42" viewBox="0 0 40 40" fill="none">
        <rect x="1" y="1" width="38" height="38" rx="11" stroke="#171717" stroke-width="1.6"/>
        <path d="M9 29 C 15 29 16 11 22 11 C 26 11 27 16 31 16" stroke="#171717" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="31" cy="16" r="3.6" fill="#2875D3"/>
        <circle cx="9" cy="29" r="2.2" fill="#171717"/>
      </svg>
      Campus<span>Kart</span>
    </div>
    <div class="micro">your campus. connected.</div>
  </div>

  <div style="position:relative">
    <div class="micro">food · rides · essentials · campus services</div>
    <h1>CAMPUS LIFE,<br><span class="serif">connected.</span></h1>
    <div class="tag">One ecosystem for the way university life actually moves.</div>
  </div>

  <div class="row chips" style="position:relative">
    <div class="chip"><b class="f">Food</b> · from the stall you trust</div>
    <div class="chip"><b class="r">Rides</b> · gate to hostel, on time</div>
    <div class="chip"><b class="e">Essentials</b> · the thing you forgot</div>
  </div>
</body>
</html>
